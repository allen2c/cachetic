name: Tests

on:
    push:
        branches:
            - main
            - "dev/**"
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: cachetic
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d cachetic"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            # poetry.lock is gitignored, so key the cache on pyproject.toml instead.
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: >-
                      venv-${{ runner.os }}-py${{ matrix.python-version }}-${{
                      hashFiles('pyproject.toml') }}

            - name: Install dependencies
              run: poetry install --no-interaction --all-extras --with dev

            - name: Lint
              run: |
                  poetry run ruff check cachetic tests
                  poetry run black --check cachetic tests
                  poetry run isort --check-only cachetic tests

            - name: Run tests
              run: poetry run pytest -v
