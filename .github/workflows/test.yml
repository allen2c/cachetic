# Ported from main so the 0.6.x maintenance branch is not released untested.
# Trimmed to what this branch has: no PostgreSQL backend, and no zstd extra in
# the base install -- the zstd cases in tests/test_v070_format_compat.py branch
# on whether the library is importable, so both halves need a run.
name: Tests

on:
    push:
        branches:
            - v0.6.x
            - "dev/**"
    pull_request:
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
                # A reader without zstandard must raise on a zstd payload
                # rather than hand back the undecoded envelope, and that path
                # only exists in an install that lacks the extra.
                extras: ["--all-extras", "--extras mongodb"]

        services:
            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            # poetry.lock is gitignored, so key the cache on pyproject.toml instead.
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: >-
                      venv-${{ runner.os }}-py${{ matrix.python-version }}-${{
                      matrix.extras }}-${{ hashFiles('pyproject.toml') }}

            - name: Install dependencies
              run: poetry install --no-interaction ${{ matrix.extras }} --with dev

            - name: Run tests
              run: poetry run pytest -v
