name: Documentation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    # Runs on pull requests too, so a broken nav entry or dead link fails review
    # instead of the live site. `deploy` will not publish unless this passes.
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            # poetry.lock is gitignored, so key the cache on pyproject.toml instead.
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-docs-${{ hashFiles('pyproject.toml') }}

            - name: Install dependencies
              run: poetry install --no-interaction --with dev

            - name: Build documentation
              run: poetry run mkdocs build --strict

    deploy:
        needs: build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            # poetry.lock is gitignored, so key the cache on pyproject.toml instead.
            - name: Load cached venv
              id: cached-poetry-dependencies
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-docs-${{ hashFiles('pyproject.toml') }}

            - name: Install dependencies
              run: poetry install --no-interaction --with dev

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Deploy to GitHub Pages
              run: poetry run mkdocs gh-deploy --force
